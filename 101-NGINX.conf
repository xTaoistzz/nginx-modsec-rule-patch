# -----------------------------------------------------------------------------
# #{{DOMAIN}}:9000
# -----------------------------------------------------------------------------
server {
    listen 9000 ssl;
    listen [::]:9000 ssl;
    server_name #{{DOMAIN}};

    # — SSL cert/key (fill in your actual paths)
    ssl_certificate /etc/nginx/ssl/#{{DOMAIN}}.crt;
    ssl_certificate_key /etc/nginx/ssl/#{{DOMAIN}}.key;

    # Allow special characters in headers
    ignore_invalid_headers off;

    # Allow any size file to be uploaded.
    # Set to a value such as 1000m; to restrict file size to a specific value
    client_max_body_size 0;

    # Disable buffering
    proxy_buffering off;
    proxy_request_buffering off;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Reverse-proxy everything else to :9002
    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }
}


# -----------------------------------------------------------------------------
# #{{DOMAIN}} (default HTTP/HTTPS)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name #{{DOMAIN}};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name #{{DOMAIN}};

    gzip off;

    access_log /var/log/nginx/#{{DOMAIN}}_access.log main;
    error_log /var/log/nginx/#{{DOMAIN}}_error.log;

    # — SSL cert/key (fill in your actual paths)
    ssl_certificate /etc/nginx/ssl/#{{DOMAIN}}.crt;
    ssl_certificate_key /etc/nginx/ssl/#{{DOMAIN}}.key;

    # Security headers
    add_header Content-Security-Policy "frame-ancestors #{{DOMAIN}}" always;
    add_header X-Frame-Options "ALLOW-FROM #{{DOMAIN}}" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /admin {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        proxy_pass http://127.0.0.1:8821;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/admin/?(.*) /$1 break;
    }

    location /authorize {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        rewrite ^/authorize/?(.*) /$1 break;
        proxy_pass http://127.0.0.1:8820;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /downloads {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        proxy_pass http://127.0.0.1:8822;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/downloads/?(.*) /$1 break;
    }

    location /uploads {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        proxy_pass http://127.0.0.1:8823;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/uploads/?(.*) /$1 break;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /content_text {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        proxy_pass http://127.0.0.1:8824;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/content_text/?(.*) /$1 break;
    }

    location /onebox_get_storage_prod {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        proxy_pass http://127.0.0.1:8825;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/onebox_get_storage_prod/?(.*) /$1 break;
    }

    location /get_storage_prod {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        proxy_pass http://127.0.0.1:8825;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/get_storage_prod/?(.*) /$1 break;
    }

    location / {
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /extension_pdfjs {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        rewrite ^/extension_pdfjs/?(.*) /$1 break;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:9005;
    }

    location /build {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        proxy_pass http://127.0.0.1:9005;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location ~* ^/documentserver_core/ {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        #proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Host $http_host/editors;
        proxy_pass http://127.0.0.1:9880;
    }

    location /onlyofficeds/ {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        # THIS ONE IS IMPORTANT ! - Trailing slash !
        proxy_pass http://127.0.0.1:9880/;

        client_max_body_size 100M; # Limit Document size to 100MB
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # THIS ONE IS IMPORTANT ! - Subfolder and NO trailing slash !
        proxy_set_header X-Forwarded-Host $host/onlyofficeds;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /document_editor {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        rewrite ^/document_editor/?(.*) /$1 break;
        proxy_pass http://127.0.0.1:8551;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /localsync {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        rewrite ^/localsync/?(.*) /$1 break;
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;
        proxy_read_timeout 3600;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8922;
    }

    location /onebox-dedicate {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        proxy_pass http://127.0.0.1:8989;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/onebox-dedicate/?(.*) /$1 break;
    }

    location /onebox-centrifugo/connection {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        proxy_pass http://127.0.0.1:8500;
        proxy_buffering off;
        keepalive_timeout 65;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scheme $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        rewrite ^/onebox-centrifugo(.*) $1 break;
    }

    location /onebox-centrifugo/ {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        proxy_pass http://127.0.0.1:8500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/onebox-centrifugo(.*) $1 break;
    }
    
    location /business-drive/ {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        client_max_body_size 5G;
        proxy_read_timeout 3600s;
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v2/ {
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oc22-administrator {
       	proxy_pass http://127.0.0.1:9012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
