# security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;

# No-Cache
add_header Last-Modified $date_gmt;
add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';

# HTTP Server
server {
  listen          80 default_server;
  server_name     _;

  access_log      /var/log/nginx/default_http_server_access.log main;
  error_log       /var/log/nginx/default_http_server_error.log;

  return 403;
}

# HTTPS Server
server {
  listen          443 ssl http2 default_server;
  server_name     _;

  access_log      /var/log/nginx/default_https_server_access.log main;
  error_log       /var/log/nginx/default_https_server_error.log;

  # SSL Configuration
  ssl_certificate                 /etc/nginx/ssl/aukakishare.mmm2007.net.crt;
  ssl_certificate_key             /etc/nginx/ssl/aukakishare.mmm2007.net.key;

  return 403;
}

aukakishare.mmm2007.net.crt